<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Roles & Project Lifecycle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        
        <!-- Header -->
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-2">Corporate Roles & Project Lifecycle</h1>
            <p class="text-slate-600 max-w-2xl">
                Explore the fundamental differences between Business and Data Analysts, and see exactly where they fit into a company's project workflow.
            </p>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex space-x-2 mb-8 bg-slate-200/50 p-1 rounded-lg w-fit mx-auto md:mx-0">
            <button id="btn-comparison" onclick="switchTab('comparison')" class="px-6 py-2.5 rounded-md font-medium transition-all duration-200 bg-white shadow-sm text-blue-600">
                Role Comparisons
            </button>
            <button id="btn-lifecycle" onclick="switchTab('lifecycle')" class="px-6 py-2.5 rounded-md font-medium transition-all duration-200 text-slate-600 hover:text-slate-900">
                Project Lifecycle Map
            </button>
        </div>

        <!-- Content Area -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-8 min-h-[600px]">
            
            <!-- TAB 1: Role Comparisons -->
            <div id="tab-comparison" class="fade-in block">
                <!-- Highlight Controls -->
                <div class="flex justify-end mb-6">
                    <button id="btn-highlight" onclick="toggleHighlight()" class="flex items-center px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 bg-amber-100 text-amber-700 border border-amber-300 shadow-inner">
                        <i data-lucide="sparkles" class="w-4 h-4 mr-2 text-amber-500" id="icon-highlight"></i>
                        <span id="text-highlight">Core Shared Skills Highlighted</span>
                    </button>
                </div>

                <div id="roles-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Roles will be injected here via JS -->
                </div>
            </div>

            <!-- TAB 2: Project Lifecycle Map -->
            <div id="tab-lifecycle" class="fade-in hidden">
                <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <div class="mb-4 md:mb-0 text-center md:text-left">
                        <h2 class="text-xl font-bold text-slate-900">How a Project Moves Through a Company</h2>
                        <p class="text-sm text-slate-500 mt-1">Watch how different roles interact from idea to launch.</p>
                    </div>
                    <div class="flex flex-wrap gap-2 justify-center">
                        <button id="btn-prev" onclick="prevStep()" class="flex items-center px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            <i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i> Prev
                        </button>
                        <button id="btn-next" onclick="nextStep()" class="flex items-center px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            Next <i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i>
                        </button>
                        <button id="btn-simulate" onclick="toggleSimulation()" class="flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors w-32 justify-center">
                            <i data-lucide="play-circle" class="w-4 h-4 mr-2" id="icon-simulate"></i>
                            <span id="text-simulate">Auto-Play</span>
                        </button>
                    </div>
                </div>

                <div class="relative border-l-2 border-slate-200 ml-4 md:ml-8 space-y-8 pb-8" id="lifecycle-container">
                    <!-- Lifecycle steps will be injected here via JS -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // Data Definitions
        const projectSteps = [
            { department: "Executive & Stakeholders", role: "Project Sponsors", action: "Idea Generation & Funding", description: "A business problem is identified. The C-Suite approves the budget and strategic vision for a new AI/Data solution.", icon: "briefcase", theme: { bg: "bg-purple-500", text: "text-purple-600", border: "border-purple-200", shadow: "shadow-purple-500/50" } },
            { department: "Product Management", role: "Product Manager", action: "Strategy & Roadmap", description: "The idea is added to the product roadmap, prioritized against other initiatives, and given a high-level scope.", icon: "layout", theme: { bg: "bg-indigo-500", text: "text-indigo-600", border: "border-indigo-200", shadow: "shadow-indigo-500/50" } },
            { department: "Business Analysis", role: "Business Analyst (BA)", action: "Requirements Gathering", description: "The BA interviews users, maps out the 'As-Is' vs 'To-Be' processes, and writes detailed User Stories and Business Requirements.", icon: "users", theme: { bg: "bg-blue-500", text: "text-blue-600", border: "border-blue-200", shadow: "shadow-blue-500/50" } },
            { department: "Data Infrastructure", role: "Big Data Engineer", action: "Distributed Architecture", description: "Sets up scalable storage systems (like Data Lakes) and compute clusters to handle massive, unstructured datasets required for the project.", icon: "server", theme: { bg: "bg-cyan-600", text: "text-cyan-600", border: "border-cyan-200", shadow: "shadow-cyan-600/50" } },
            { department: "Data Engineering", role: "Data Engineer", action: "Data Pipelines (ETL)", description: "Builds robust pipelines to extract, transform, and load (ETL) raw data from various sources into structured data warehouses.", icon: "network", theme: { bg: "bg-blue-600", text: "text-blue-600", border: "border-blue-200", shadow: "shadow-blue-600/50" } },
            { department: "Data & Analytics", role: "Data Analyst (DA)", action: "Exploratory Analysis & KPIs", description: "Analyzes the processed data to define baseline metrics, find initial trends, and build performance dashboards for stakeholders.", icon: "line-chart", theme: { bg: "bg-emerald-500", text: "text-emerald-600", border: "border-emerald-200", shadow: "shadow-emerald-500/50" } },
            { department: "Data Science", role: "Data Scientist", action: "Predictive Modeling", description: "Applies statistical algorithms and trains machine learning models to solve the core business problem (e.g., predicting customer behavior).", icon: "brain", theme: { bg: "bg-violet-600", text: "text-violet-600", border: "border-violet-200", shadow: "shadow-violet-600/50" } },
            { department: "Machine Learning", role: "Machine Learning Engineer", action: "Model Productization", description: "Takes the Data Scientist's model, optimizes it for speed and scale, and integrates it into production pipelines (MLOps).", icon: "cpu", theme: { bg: "bg-amber-500", text: "text-amber-600", border: "border-amber-200", shadow: "shadow-amber-500/50" } },
            { department: "Artificial Intelligence", role: "AI Engineer", action: "Advanced AI Integration", description: "Embeds specialized AI, such as Generative AI (LLMs) or Computer Vision, to give the application advanced cognitive capabilities.", icon: "bot", theme: { bg: "bg-fuchsia-500", text: "text-fuchsia-600", border: "border-fuchsia-200", shadow: "shadow-fuchsia-500/50" } },
            { department: "Design & Engineering", role: "UI/UX & Software Devs", action: "App Architecture & UI", description: "Designers create the interface, and developers build the front-end and back-end that wraps around the data models.", icon: "code", theme: { bg: "bg-orange-500", text: "text-orange-600", border: "border-orange-200", shadow: "shadow-orange-500/50" } },
            { department: "Quality Assurance", role: "QA Tester & BA", action: "Testing & UAT", description: "QA finds technical bugs. The BA facilitates User Acceptance Testing (UAT) to ensure the final product actually solves the business problem.", icon: "check-circle", theme: { bg: "bg-red-500", text: "text-red-600", border: "border-red-200", shadow: "shadow-red-500/50" } },
            { department: "Operations / DevOps", role: "Release Manager", action: "Deployment & Launch", description: "The final data product is pushed to production. The project is now live for end-users!", icon: "rocket", theme: { bg: "bg-teal-500", text: "text-teal-600", border: "border-teal-200", shadow: "shadow-teal-500/50" } }
        ];

        const rolesData = [
            {
                title: 'Business Analyst', focus: 'The "Why" & "How"', icon: 'users',
                styles: { iconBg: 'bg-blue-100 text-blue-600', borderLight: 'border-blue-100', focusText: 'text-blue-600', arrow: 'text-blue-500', pathBox: 'bg-blue-50 border-blue-100', pathTitle: 'text-blue-900', pathText: 'text-blue-800' },
                responsibilities: [
                    'Requirements Elicitation: Interviewing stakeholders to understand needs.',
                    'Process Mapping: Creating As-Is and To-Be workflow diagrams.',
                    'Documentation: Writing BRDs, FRDs, and Agile User Stories.',
                    'Stakeholder Alignment: Acting as the bridge between business and IT.',
                    'UAT Facilitation: Ensuring the final product meets business criteria.'
                ],
                skills: ['Communication', 'Jira / Confluence', 'Visio / Lucidchart', 'BPMN 2.0', 'SQL'],
                careerPath: 'Junior BA ➔ Senior BA ➔ Product Owner ➔ Project Manager ➔ Business Architect'
            },
            {
                title: 'Data Analyst', focus: 'The "What" & "Evidence"', icon: 'database',
                styles: { iconBg: 'bg-emerald-100 text-emerald-600', borderLight: 'border-emerald-100', focusText: 'text-emerald-600', arrow: 'text-emerald-500', pathBox: 'bg-emerald-50 border-emerald-100', pathTitle: 'text-emerald-900', pathText: 'text-emerald-800' },
                responsibilities: [
                    'Data Extraction: Pulling raw data from complex databases.',
                    'Data Cleaning: Removing anomalies and standardizing datasets.',
                    'Exploratory Data Analysis (EDA): Finding hidden patterns in data.',
                    'Dash-boarding: Building visual reports for executive leadership.',
                    'Metric Tracking: Monitoring KPIs to explain past performance.'
                ],
                skills: ['SQL', 'Python', 'Tableau / Power BI', 'Statistics', 'Adv. Excel'],
                careerPath: 'Junior DA ➔ Senior DA ➔ BI Developer ➔ Data Architect ➔ Chief Data Officer'
            },
            {
                title: 'Data Engineer', focus: 'The "Plumbing" & "Infrastructure"', icon: 'network',
                styles: { iconBg: 'bg-cyan-100 text-cyan-600', borderLight: 'border-cyan-100', focusText: 'text-cyan-600', arrow: 'text-cyan-500', pathBox: 'bg-cyan-50 border-cyan-100', pathTitle: 'text-cyan-900', pathText: 'text-cyan-800' },
                responsibilities: [
                    'Data Pipelines: Building robust ETL/ELT pipelines.',
                    'Architecture: Designing Data Warehouses and Data Lakes.',
                    'Performance: Optimizing database queries and data processing speeds.',
                    'Data Quality: Ensuring data is accurate, available, and secure.',
                    'Integration: Connecting multiple disparate data sources.'
                ],
                skills: ['Python', 'Spark / Hadoop', 'Airflow / dbt', 'Cloud Platforms', 'NoSQL'],
                careerPath: 'Junior DE ➔ Senior DE ➔ Lead Data Engineer ➔ Data Architect'
            },
            {
                title: 'Machine Learning Engineer', focus: 'The "Deployment" & "Scalability"', icon: 'cpu',
                styles: { iconBg: 'bg-amber-100 text-amber-600', borderLight: 'border-amber-100', focusText: 'text-amber-600', arrow: 'text-amber-500', pathBox: 'bg-amber-50 border-amber-100', pathTitle: 'text-amber-900', pathText: 'text-amber-800' },
                responsibilities: [
                    'Model Productization: Deploying data science models into production.',
                    'MLOps: Building CI/CD pipelines for machine learning models.',
                    'Optimization: Reducing model latency and improving inference speed.',
                    'Monitoring: Tracking model drift and performance over time.',
                    'Infrastructure: Managing GPU clusters and environments.'
                ],
                skills: ['Python', 'Docker / K8s', 'TensorFlow / PyTorch', 'MLflow', 'Cloud Platforms'],
                careerPath: 'Junior MLE ➔ Senior MLE ➔ Lead MLE ➔ Head of AI/ML'
            },
            {
                title: 'AI Engineer', focus: 'The "Cognition" & "Generative AI"', icon: 'bot',
                styles: { iconBg: 'bg-fuchsia-100 text-fuchsia-600', borderLight: 'border-fuchsia-100', focusText: 'text-fuchsia-600', arrow: 'text-fuchsia-500', pathBox: 'bg-fuchsia-50 border-fuchsia-100', pathTitle: 'text-fuchsia-900', pathText: 'text-fuchsia-800' },
                responsibilities: [
                    'Integration: Embedding LLMs and computer vision into apps.',
                    'RAG Systems: Building Retrieval-Augmented Generation pipelines.',
                    'Prompt Engineering: Optimizing prompts for foundational models.',
                    'Fine-tuning: Adjusting existing AI models to specific company data.',
                    'Prototyping: Rapidly building POCs using new AI APIs.'
                ],
                skills: ['Python', 'LangChain / LlamaIndex', 'Vector DBs', 'OpenAI API', 'Cloud Platforms'],
                careerPath: 'AI Developer ➔ Senior AI Engineer ➔ Principal AI ➔ Chief AI Officer'
            }
        ];

        // State variables
        let highlightShared = true;
        let activeStep = 0;
        let isPlaying = false;
        let simInterval = null;

        // Calculate repeating skills
        const skillCounts = {};
        rolesData.forEach(role => {
            role.skills.forEach(skill => {
                skillCounts[skill] = (skillCounts[skill] || 0) + 1;
            });
        });
        const repeatingSkills = Object.keys(skillCounts).filter(skill => skillCounts[skill] > 1);

        // Core Functions
        function init() {
            renderRoles();
            renderLifecycle();
            lucide.createIcons();
        }

        function switchTab(tab) {
            const tabComp = document.getElementById('tab-comparison');
            const tabLife = document.getElementById('tab-lifecycle');
            const btnComp = document.getElementById('btn-comparison');
            const btnLife = document.getElementById('btn-lifecycle');

            if (tab === 'comparison') {
                tabComp.classList.remove('hidden');
                tabLife.classList.add('hidden');
                btnComp.className = "px-6 py-2.5 rounded-md font-medium transition-all duration-200 bg-white shadow-sm text-blue-600";
                btnLife.className = "px-6 py-2.5 rounded-md font-medium transition-all duration-200 text-slate-600 hover:text-slate-900";
            } else {
                tabComp.classList.add('hidden');
                tabLife.classList.remove('hidden');
                btnLife.className = "px-6 py-2.5 rounded-md font-medium transition-all duration-200 bg-white shadow-sm text-indigo-600";
                btnComp.className = "px-6 py-2.5 rounded-md font-medium transition-all duration-200 text-slate-600 hover:text-slate-900";
                
                // Recalculate icons in case they weren't rendered
                setTimeout(() => lucide.createIcons(), 50);
            }
        }

        function toggleHighlight() {
            highlightShared = !highlightShared;
            
            // Update button UI
            const btn = document.getElementById('btn-highlight');
            const icon = document.getElementById('icon-highlight');
            const text = document.getElementById('text-highlight');
            
            if (highlightShared) {
                btn.className = "flex items-center px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 bg-amber-100 text-amber-700 border border-amber-300 shadow-inner";
                text.innerText = "Core Shared Skills Highlighted";
                icon.classList.add('text-amber-500');
                icon.classList.remove('text-slate-400');
            } else {
                btn.className = "flex items-center px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 bg-white text-slate-600 border border-slate-200 hover:bg-slate-50";
                text.innerText = "Highlight Shared Skills";
                icon.classList.remove('text-amber-500');
                icon.classList.add('text-slate-400');
            }
            
            renderRoles();
            lucide.createIcons();
        }

        function renderRoles() {
            const container = document.getElementById('roles-container');
            let html = '';

            rolesData.forEach(role => {
                let responsibilitiesHtml = role.responsibilities.map(resp => {
                    const splitIndex = resp.indexOf(':');
                    const boldPart = resp.substring(0, splitIndex + 1);
                    const rest = resp.substring(splitIndex + 1);
                    return `<li>• <strong>${boldPart}</strong>${rest}</li>`;
                }).join('');

                let skillsHtml = role.skills.map(skill => {
                    const isShared = repeatingSkills.includes(skill);
                    const isHighlighted = highlightShared && isShared;
                    
                    const classes = isHighlighted 
                        ? 'bg-amber-100 border-amber-300 text-amber-800 ring-1 ring-amber-400 font-bold shadow-sm'
                        : 'bg-white border-slate-200 text-slate-700 font-medium';
                        
                    const sparkleIcon = isHighlighted ? `<i data-lucide="sparkles" class="inline w-3 h-3 mr-1 mb-0.5 text-amber-600"></i>` : '';
                    
                    return `<span class="px-3 py-1 border rounded-full text-xs transition-all duration-300 ${classes}">${sparkleIcon}${skill}</span>`;
                }).join('');

                html += `
                    <div class="space-y-6">
                        <div class="flex items-center space-x-4 border-b ${role.styles.borderLight} pb-4">
                            <div class="p-3 rounded-xl ${role.styles.iconBg}">
                                <i data-lucide="${role.icon}" class="w-7 h-7"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold text-slate-900">${role.title}</h2>
                                <p class="${role.styles.focusText} font-medium text-sm">Focus: ${role.focus}</p>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                                <h3 class="font-semibold text-slate-900 mb-3 flex items-center">
                                    <i data-lucide="arrow-right" class="w-4 h-4 mr-2 ${role.styles.arrow}"></i> Core Responsibilities
                                </h3>
                                <ul class="space-y-2 text-sm text-slate-600">
                                    ${responsibilitiesHtml}
                                </ul>
                            </div>

                            <div class="bg-slate-50 p-5 rounded-xl border border-slate-100">
                                <h3 class="font-semibold text-slate-900 mb-3 flex items-center">
                                    <i data-lucide="arrow-right" class="w-4 h-4 mr-2 ${role.styles.arrow}"></i> Essential Skill Set
                                </h3>
                                <div class="flex flex-wrap gap-2">
                                    ${skillsHtml}
                                </div>
                            </div>

                            <div class="p-5 rounded-xl border ${role.styles.pathBox}">
                                <h3 class="font-semibold ${role.styles.pathTitle} mb-3 flex items-center">
                                    <i data-lucide="arrow-right" class="w-4 h-4 mr-2 ${role.styles.arrow}"></i> Career Path
                                </h3>
                                <p class="text-sm ${role.styles.pathText} font-medium leading-relaxed">
                                    ${role.careerPath}
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderLifecycle() {
            const container = document.getElementById('lifecycle-container');
            let html = '';

            projectSteps.forEach((step, index) => {
                const isActive = activeStep === index;
                const isPast = activeStep > index;
                
                let dotClasses = "";
                let cardClasses = "";
                let titleColor = "";
                
                if (isActive) {
                    dotClasses = `${step.theme.bg} text-white scale-125 shadow-lg ${step.theme.shadow}`;
                    cardClasses = `bg-white ${step.theme.border} shadow-md transform scale-[1.02]`;
                    titleColor = step.theme.text;
                } else if (isPast) {
                    dotClasses = "bg-slate-300 text-white";
                    cardClasses = "bg-slate-50 border-slate-100 opacity-60 hover:opacity-100";
                    titleColor = "text-slate-400";
                } else {
                    dotClasses = "bg-slate-100 text-slate-400";
                    cardClasses = "bg-slate-50 border-slate-100 opacity-60 hover:opacity-100";
                    titleColor = "text-slate-400";
                }

                const iconHtml = (isActive || !isPast) ? `<i data-lucide="${step.icon}" class="w-5 h-5"></i>` : `<i data-lucide="check-circle" class="w-5 h-5"></i>`;

                html += `
                    <div class="relative pl-8 md:pl-12">
                        <!-- Timeline Dot/Icon -->
                        <div class="absolute -left-[21px] top-1 w-10 h-10 rounded-full flex items-center justify-center border-4 border-white transition-all duration-500 ${dotClasses}">
                            ${iconHtml}
                        </div>

                        <!-- Content Card -->
                        <div class="p-5 rounded-xl border transition-all duration-500 ${cardClasses}">
                            <div class="flex flex-col md:flex-row md:justify-between md:items-start mb-2">
                                <div>
                                    <span class="text-xs font-bold uppercase tracking-wider mb-1 block ${titleColor}">
                                        Phase ${index + 1}: ${step.department}
                                    </span>
                                    <h3 class="text-lg font-bold text-slate-900">${step.action}</h3>
                                </div>
                                <span class="mt-2 md:mt-0 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-200 text-slate-700 w-fit">
                                    ${step.role}
                                </span>
                            </div>
                            <p class="text-sm text-slate-600 mt-2">
                                ${step.description}
                            </p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateControls();
        }

        function updateControls() {
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnSimulate = document.getElementById('btn-simulate');
            const iconSimulate = document.getElementById('icon-simulate');
            const textSimulate = document.getElementById('text-simulate');

            if (btnPrev && btnNext && btnSimulate) {
                if (isPlaying) {
                    // Playing state
                    btnPrev.disabled = true;
                    btnNext.disabled = true;
                    
                    btnSimulate.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                    btnSimulate.classList.add('bg-amber-500', 'hover:bg-amber-600');
                    textSimulate.innerText = "Pause";
                    iconSimulate.setAttribute('data-lucide', 'pause-circle');
                } else {
                    // Paused/Manual state
                    btnPrev.disabled = activeStep === 0;
                    btnNext.disabled = activeStep >= projectSteps.length - 1;
                    
                    btnSimulate.classList.remove('bg-amber-500', 'hover:bg-amber-600');
                    btnSimulate.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                    textSimulate.innerText = activeStep >= projectSteps.length - 1 ? "Restart" : "Auto-Play";
                    iconSimulate.setAttribute('data-lucide', activeStep >= projectSteps.length - 1 ? 'rotate-ccw' : 'play-circle');
                }
            }
        }

        function nextStep() {
            if (isPlaying) return;
            if (activeStep < projectSteps.length - 1) {
                activeStep++;
                renderLifecycle();
                lucide.createIcons();
            }
        }

        function prevStep() {
            if (isPlaying) return;
            if (activeStep > 0) {
                activeStep--;
                renderLifecycle();
                lucide.createIcons();
            }
        }

        function toggleSimulation() {
            if (isPlaying) {
                // Pause simulation
                clearInterval(simInterval);
                isPlaying = false;
                updateControls();
                lucide.createIcons();
            } else {
                // Start/Restart simulation
                if (activeStep >= projectSteps.length - 1) {
                    activeStep = 0; // Reset if at the end
                }
                
                isPlaying = true;
                updateControls();
                lucide.createIcons();

                simInterval = setInterval(() => {
                    activeStep++;
                    
                    if (activeStep >= projectSteps.length - 1) {
                        clearInterval(simInterval);
                        isPlaying = false;
                        renderLifecycle();
                        lucide.createIcons();
                    } else {
                        renderLifecycle();
                        lucide.createIcons();
                    }
                }, 2500); // Slowed down to 2.5 seconds per step
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
